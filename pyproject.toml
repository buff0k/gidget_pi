[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gidget-pi"
version = "0.1.0"
description = "Gidget Raspberry Pi robot dashboard, GPS logger, OLED status display, environmental monitor, LIDAR monitor, IMU monitor, and WiFi management UI"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Werkzeug>=3.0",
    "waitress>=3.0",
    "pyserial>=3.5",
    "pynmea2>=1.19",
    "Pillow>=10.0",
    "adafruit-blinka>=8.0",
    "adafruit-circuitpython-ssd1306>=2.12",
    "adafruit-circuitpython-ahtx0>=1.0",
    "adafruit-circuitpython-bmp280>=3.3",
    "adafruit-circuitpython-vl53l0x>=3.6",
    "adafruit-circuitpython-vl53l1x>=1.2",
    "circuitpython-bmi160>=0.2.9"
]
